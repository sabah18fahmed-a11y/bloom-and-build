<style>

.warn{background:var(--blush);border:1px solid var(--rose);border-radius:16px;padding:14px 18px;margin:14px 0}.tl{border-left:2px solid var(--rose);margin-left:10px;padding-left:24px}.tl .card{margin-bottom:18px;position:relative}.tl .card::before{content:"✿";position:absolute;left:-38px;top:16px;background:var(--bg);color:var(--rose)}
table{width:100%;border-collapse:collapse;font-size:.9rem}th,td{text-align:left;padding:9px;border-bottom:1px solid var(--line)}.chip{display:inline-block;border-radius:99px;padding:2px 11px;font-size:.78rem;background:var(--blush)}.Critical{background:var(--pink);color:#9a3f55}.Weak{background:var(--beige)}
.fld{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));margin:12px 0}.note{border-left:3px solid var(--pink);padding-left:12px}.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 22px;border-radius:99px;z-index:9}

.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:34px;margin:20px 0}.sub2{font-size:2rem;margin:30px 0 10px}.task{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px;margin:10px 0}.task.k>.row>input:not([type=checkbox]){text-decoration:line-through;opacity:.6}.ent{text-align:left;border-radius:22px}
.pages{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr));gap:28px;margin-top:20px}.pgw{background:var(--card);border:1px solid var(--line);border-left:7px solid var(--pink);border-radius:8px 26px 26px 8px;padding:22px 28px;box-shadow:var(--sh)}.pgw h3{font-size:1.7rem;color:var(--rose)}
.pg{min-height:340px;border:0;border-radius:0;padding:0;background:repeating-linear-gradient(transparent 0 33px,var(--line) 33px 34px);font:1.15rem/34px 'Cormorant Garamond',serif}.pg:focus{outline:0}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}.cell{min-height:120px;border-radius:18px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px;font-size:.8rem}.cell.today{border:2px solid var(--rose)}.cell.full{background:var(--pink)}.cell.empty{visibility:hidden}.ev{font-size:.68rem;background:var(--blush);border-radius:8px;padding:1px 6px}
@media(max-width:760px){nav{position:fixed;top:auto;bottom:0;left:0;right:0;border-top:1px solid var(--line);border-bottom:0;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px))}nav a{padding:10px 14px}nav a.on::after{display:none}h1{font-size:2.2rem}.cell{min-height:74px;padding:3px}.cell svg{width:22px}.hero{gap:14px}
table,thead,tbody,tr,td{display:block}thead{display:none}tr{background:var(--card);border:1px solid var(--line);border-radius:14px;margin:8px 0;padding:6px}td{border:0;padding:3px 8px}td::before{content:attr(data-l) ": ";color:var(--mut)}}
</style></head><body>
<header><div><h1>Bloom &amp; Build</h1><div class="sub">Study. Build. Become.</div></div><div style="text-align:right"><div id="q"></div><button data-a="th" aria-label="Toggle dark mode">◐ Theme</button></div></header>
<nav id="nav"></nav><main id="app"></main>
<script>
document.documentElement.classList.add('js');const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const KEY='bloombuild2';let S=null;try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S){S={};try{const o=JSON.parse(localStorage.getItem('bloombuild1'));if(o){S=o;S.tpl=o.sched;S.days={};for(const d in o.pl||{})S.days[d]={notes:Object.values(o.pl[d]).filter(Boolean).join('\n')}}}catch(e){}}
const D=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];

for(let d=0;d<5;d++)w.forEach(b=>r.push({id:i++,d,t:b[0],n:b[1],x:b[2],m:b[3],s:b[4]}));
[['Morning','US accounting practical project',180,1],['Afternoon','Python project',150,1],['Evening','Weekly review: done? missed? moved? improved? change next week?',45,0]].forEach(b=>r.push({id:i++,d:5,t:b[0],n:b[1],x:'',m:b[2],s:b[3]}));
[['Morning','Qur\'an / reflection'],['Midday','Personal planning & weekly review'],['Afternoon','Light revision (only if needed)'],['Evening','Rest & personal time']].forEach(b=>r.push({id:i++,d:6,t:b[0],n:b[1],x:'',m:0,s:0}));return r}
const def={tpl:mk(),items:[],gen:{},days:{},jn:{},dl:[],sel:'',jd:'',mo:'',wo:0,sec:{},st:{},cpa:[],notes:[],apps:[],proj:{},pl:{},cn:{},rm:{},theme:'',bda:0,exam:'',seq:500,start:'',stage:0};
for(const k in def)if(S[k]==null)S[k]=def[k];
['Data & business context','CRISP-DM','Data preparation & cleaning','Descriptive statistics','Data visualisation','Predictive modelling basics','Ethics & governance','Communicating insights'].forEach((n,i)=>{if(!S.cpa[i]&&S.cpa.length<8)S.cpa.push({n,r:'Okay',p:0})});
const pad=n=>String(n).padStart(2,'0'),dk=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()),td=()=>dk(new Date());
if(!S.start)S.start=td();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const setp=(p,v)=>{const a=p.split('.');let o=S;for(let i=0;i<a.length-1;i++)o=o[a[i]]??=({});o[a[a.length-1]]=v;save()};
const wd=()=>(new Date().getDay()+6)%7,days=()=>Math.floor((new Date(td())-new Date(S.start))/864e5),wk=()=>Math.min(12,Math.floor(days()/7)+1);
const addD=(x,n)=>{const d=new Date(x+'T12:00:00');d.setDate(d.getDate()+n);return dk(d)},wdo=x=>(new Date(x+'T12:00:00').getDay()+6)%7,fmtD=x=>new Date(x+'T12:00:00').toLocaleDateString(undefined,{month:'long',day:'numeric',year:'numeric'});
const ens=x=>{if(S.gen[x]||x<S.start)return;S.gen[x]=1;S.tpl.filter(b=>b.d==wdo(x)).forEach(b=>S.items.push({id:++S.seq,date:x,ty:'b',t:b.t,n:b.n,x:b.x,m:b.m,s:b.s,k:0}))};
const its=x=>{ens(x);return S.items.filter(i=>i.date==x)},live=x=>its(x).filter(i=>i.k!=2),pct=x=>{const a=live(x);return a.length?Math.round(a.filter(i=>i.k==1).length/a.length*100):0};
const hrs=x=>sec(x)/3600+(+(S.days[x]||{}).hrs||0),ld=x=>live(x).filter(i=>i.s).reduce((a,i)=>a+i.m,0);
const bl=w=>`<svg viewBox="-50 -50 100 100" width="${w}" aria-hidden="true"><g fill="var(--pink)" stroke="var(--rose)" stroke-width=".7">${[0,72,144,216,288].map(a=>`<ellipse cy="-20" rx="11" ry="20" transform="rotate(${a})"/>`).join('')}</g><circle r="7" fill="var(--cream)" stroke="var(--rose)" stroke-width=".7"/></svg>`,fdiv='<div class="fdiv">'+bl(36)+'</div>';
const ST=['Seed','Sprout','Leaves','Bud','Full Bloom'],stg=p=>Math.min(4,Math.floor(p/20));
const sprig='<svg class="sp" viewBox="0 0 60 24" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M2 12h54M14 12q4-8 10-8M14 12q4 8 10 8M32 12q4-8 10-8M32 12q4 8 10 8M52 12q4-5 6-3"/></svg>';

if(!s)g+='<ellipse cx="60" cy="122" rx="6" ry="4" fill="var(--rose)"/>';else{g+=`<path d="M60 126V${t}" stroke="var(--sage)" stroke-width="3" stroke-linecap="round"/>`+L(t+14,1)+(s>1?L(t+30,-1)+L(t+46,1):'');
if(s==3)g+=`<ellipse cx="60" cy="${t-8}" rx="8" ry="13" fill="var(--rose)"/><path d="M52 ${t}q8 6 16 0" stroke="var(--sage)" fill="none" stroke-width="2"/>`;
if(s==4){for(let k=0;k<8;k++)g+=`<ellipse cx="60" cy="${t-22}" rx="8" ry="15" transform="rotate(${k*45} 60 ${t-8})" fill="var(--rose)" opacity=".78"/>`;g+=`<circle cx="60" cy="${t-8}" r="7" fill="var(--beige)"/>`}}

const sec=d=>Object.keys(S.sec).filter(k=>k.startsWith(d+'|')).reduce((a,k)=>a+S.sec[k],0);
const streak=()=>{let n=0,d=td();const ok=x=>S.items.some(i=>i.date==x&&i.k==1);if(!ok(d))d=addD(d,-1);while(ok(d)){n++;d=addD(d,-1)}return n};

const BK=['Chart of accounts','Debits and credits','Journal entries','Accounts receivable','Accounts payable','Bank reconciliation','Accrual vs cash basis','Adjusting entries','Financial statements'];
const QB=['Company setup','Chart of accounts','Customers','Vendors','Invoices','Bills','Expenses','Bank transactions','Bank reconciliation','Profit & Loss','Balance Sheet','Accounts Receivable','Accounts Payable'];
const TX=['Form 1040','Schedule C','W-2','1099-NEC','1099-MISC','1099-INT','Estimated taxes','Deductions','Credits','Self-employment income'];
const PY=['Python Fundamentals','NumPy','Pandas','Data Cleaning','Data Analysis','Data Visualization','Accounting Analytics Projects'],PL=['Learn','Practice','Mini Challenge','Project','Completed'];
const SK={Accounting:['Journal entries','Bank reconciliation','Financial statements','Accounts payable','Accounts receivable','Bookkeeping','Excel','QuickBooks'],'US Tax':['Form 1040','Schedule C','W-2','1099s','Deductions','Credits','Tax workflow'],Data:['Data cleaning','Descriptive statistics','Data visualization','CRISP-DM','Business analytics'],Python:['Python fundamentals','NumPy','Pandas','Data cleaning','Visualization','Accounting data analysis'],Professional:['Communication','Client communication','Professional email','Interview skills','LinkedIn','Freelancing']};
const SL=['Not Started','Learning','Practising','Confident','Mastered'],PJ=['Small Business Bookkeeping Simulation','Bank Reconciliation','US Individual Tax Simulation','Accounting Data Analysis with Python','Business Performance Dashboard'];

pCpa=()=>Math.round(S.cpa.reduce((a,t)=>a+(+t.p||0),0)/Math.max(1,S.cpa.length)),pPf=()=>Math.round(PJ.reduce((a,_,i)=>a+({'In progress':.5,Completed:1}[(S.proj[i]||{}).st]||0),0)/5*100);

const area=(n,p)=>`<div style="margin:10px 0"><div class="row" style="justify-content:space-between;margin:0"><span>${n}</span><b>${p}%</b></div><div class="bar"><i style="width:${p}%"></i></div></div>`;
const head=(t,l)=>`<div class="sh"><h2>${t}</h2><p class="lead">${l}</p></div>`;
const TASKS=[['am','Morning','CPA / BDA','2 hours','Learn → Practise → Recall'],['pm','Afternoon','US Accounting & Tax','2 hours','Practical client-style work'],['ev','Evening','Python','1 hour','Programming + accounting-data exercises']];

V.today=()=>{const t=td(),p=pct(t),dy=S.days[t]||{},it=live(t),dn=it.filter(i=>i.k==1).length,cur=Math.min(5,Math.floor(days()/14)),RM=['Foundation','Practical Accounting','US Tax Foundation','Tax Practice','Business Tax + Analytics','Portfolio & Income'],hr=new Date().getHours(),gr=hr<12?'Good morning':hr<18?'Good afternoon':'Good evening',tot=Object.keys(S.sec).reduce((a,k)=>a+S.sec[k],0)/3600,ms=Object.keys(S.st).filter(k=>k.startsWith('sk:')&&S.st[k]==4).length,pj=PJ.filter((_,i)=>(S.proj[i]||{}).st=='Completed').length;

const SEC=[['today','Today'],['daily','Daily Planner'],['schedule','Weekly'],['month','Calendar'],['roadmap','Roadmap'],['cpa','CPA & BDA'],['acct','US Accounting'],['tax','US Tax'],['qb','QuickBooks'],['python','Python'],['skills','Skills'],['portfolio','Portfolio'],['journal','Journal'],['progress','Progress'],['apps','Applications'],['notes','Notes']];
$('#nav').innerHTML=SEC.map(n=>`<a href="#${n[0]}">${n[1]}</a>`).join('');
function toast(m){const e=document.createElement('div');e.className='toast';e.textContent=m;document.body.appendChild(e);setTimeout(()=>e.remove(),3500)}
const seen=new Set();let io=null;
function mark(){let c='today';document.querySelectorAll('.sec').forEach(x=>{if(x.getBoundingClientRect().top<160)c=x.id});document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('on',a.getAttribute('href')=='#'+c))}
function render(){const y=scrollY;$('#app').innerHTML=SEC.map(n=>`<section class="sec ${seen.has(n[0])?'in':''}" id="${n[0]}"><div class="wrap"><div class="corner">${bl(170)}</div>${V[n[0]]()}</div></section>${fdiv}`).join('');scrollTo({top:y,behavior:'instant'});
io&&io.disconnect();if('IntersectionObserver'in window){io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');seen.add(e.target.id)}}),{threshold:.04});document.querySelectorAll('.sec').forEach(x=>io.observe(x))}else document.querySelectorAll('.sec').forEach(x=>x.classList.add('in'));mark();
const s=stg(overall());if(s>S.stage){toast('Your garden is growing: '+ST[s]+' ✿')}S.stage=s;save()}
addEventListener('scroll',mark,{passive:true});
const mvb=(id,d)=>{const b=S.sched.find(x=>x.id==id);if(b)b.d=d};const A={
th(){S.theme=document.documentElement.dataset.theme=='dark'?'light':'dark';document.documentElement.dataset.theme=S.theme;save()},
lv(d){const v=lv(d.k),n=+d.n;S.st[d.k]=v==n?n-1:n;render()},rm(d){S.rm[d.i]=!S.rm[d.i];render()},bda(){S.bda=S.bda?0:1;render()},
tm(d){run=run==d.id?null:d.id;render()},
bk(d){const b=S.items.find(x=>x.id==d.id);b.k=b.k==1?0:1;if(b.k&&pct(b.date)==100)toast('A full day. Beautifully done ✿');render()},
be(d){const b=S.items.find(x=>x.id==d.id),n=prompt('Title',b.n);if(n==null)return;b.n=n;b.t=prompt('Time',b.t)||b.t;b.m=+prompt('Minutes',b.m)||b.m;b.x=prompt('Notes',b.x)??b.x;render()},
bd(d){const b=S.items.find(x=>x.id==d.id);S.items.push({...b,id:++S.seq,k:0});render()},bx(d){if(confirm('Delete this item?')){S.items=S.items.filter(x=>x.id!=d.id);render()}},
add(d){const n=prompt('New study block or task');if(!n)return;S.items.push({id:++S.seq,date:d.d,ty:d.ty||'b',t:prompt('Time (e.g. 5:00–6:00)','')||'Anytime',n,x:'',m:+prompt('Minutes',60)||60,s:confirm('Count as serious study?')?1:0,k:0,c:'',p:'Medium'});render()},
addtk(d){const g=i=>$('#tk-'+i).value;if(!g('n'))return;S.items.push({id:++S.seq,date:d.d,ty:'t',n:g('n'),c:g('c'),t:g('t')||'Anytime',p:g('p'),x:'',m:0,s:0,k:0});render()},
redis(){let g=0;for(const x of [...new Set(S.items.map(i=>i.date))].sort()){while(ld(x)>360&&g++<60){const b=live(x).filter(i=>i.s).pop();let n=addD(x,1);while(wdo(n)==6||ld(n)+b.m>360)n=addD(n,1);b.date=n}}render();toast('Redistributed — rest stays protected.')},
mv(d,el){const b=S.items.find(x=>x.id==d.id),v=el.value;if(v=='t')b.date=addD(td(),1);else if(v=='s'){let n=td();while(wdo(n)!=5)n=addD(n,1);b.date=n}else if(v=='k')b.k=2;else if(v=='r'){const n=prompt('New date (YYYY-MM-DD)',td());if(/^\d{4}-\d\d-\d\d$/.test(n||''))b.date=n}render()},
open(d){S.sel=d.d;render();$('#daily').scrollIntoView({behavior:'smooth'})},dd(d){S.sel=+d.n?addD(S.sel||td(),+d.n):td();render()},dpick(d,el){S.sel=el.value||td();render()},
jpick(d,el){S.jd=el.value||td();render()},jopen(d){S.jd=d.d;render();$('#journal').scrollIntoView({behavior:'smooth'})},wo(d){S.wo=+d.n?S.wo+ +d.n:0;render()},
mn(d){if(!+d.n){S.mo='';return render()}const[y,m]=(S.mo||td().slice(0,7)).split('-').map(Number),x=new Date(y,m-1+ +d.n,1);S.mo=x.getFullYear()+'-'+pad(x.getMonth()+1);render()},
addev(){const d=$('#ev-d').value,n=$('#ev-n').value;if(!d||!n)return;S.dl.push({id:++S.seq,date:d,n,ty:$('#ev-t').value});render()},evx(d){S.dl=S.dl.filter(e=>e.id!=d.id);render()},
addap(){const g=i=>$('#ap-'+i).value;if(!g('c')&&!g('r'))return;S.apps.push({id:++S.seq,c:g('c'),r:g('r'),y:g('y'),m:g('m'),d:g('d'),s:g('s'),f:g('f'),sa:g('sa'),ct:g('ct'),n:g('n')});render()},
apx(d){S.apps=S.apps.filter(a=>a.id!=d.id);render()},
ns(){const g=i=>$('#ne-'+i).value;if(!g('t')&&!g('b'))return;const o={c:g('c'),t:g('t'),g:g('g'),b:g('b')};if(F.eid){Object.assign(S.notes.find(n=>n.id==F.eid),o);F.eid=0}else S.notes.push({id:++S.seq,...o});render()},
ne(d){const n=S.notes.find(x=>x.id==d.id);F.eid=n.id;$('#ne-c').value=n.c;$('#ne-t').value=n.t;$('#ne-g').value=n.g;$('#ne-b').value=n.b;scrollTo({top:0,behavior:'smooth'})},
np(d){const n=S.notes.find(x=>x.id==d.id);n.pin=!n.pin;render()},nf(d){const n=S.notes.find(x=>x.id==d.id);n.fav=!n.fav;render()},nx(d){if(confirm('Delete note?')){S.notes=S.notes.filter(n=>n.id!=d.id);render()}},
sk(d,el){S.st[d.k]=+el.value;render()},aps(d,el){S.apps.find(a=>a.id==d.id).s=el.value;render()}};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&A[b.dataset.a])A[b.dataset.a](b.dataset,b)});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.ch)A[t.dataset.ch](t.dataset,t);else if(t.dataset.re)render()});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset.in)setp(t.dataset.in,t.type=='range'?+t.value:t.value);if(t.dataset.f){F[t.dataset.f]=t.value;t.dataset.f[0]=='n'?$('#nl').innerHTML=noteList():$('#al').innerHTML=appList()}});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.f){F[t.dataset.f]=t.value;t.dataset.f[0]=='n'?$('#nl').innerHTML=noteList():$('#al').innerHTML=appList()}});
document.addEventListener('dragstart',e=>{const b=e.target.closest('.blk');if(b)e.dataTransfer.setData('t',b.dataset.id)});
document.addEventListener('dragover',e=>{if(e.target.closest('.col'))e.preventDefault()});
document.addEventListener('drop',e=>{const c=e.target.closest('.col'),id=e.dataTransfer.getData('t');if(c&&id){e.preventDefault();(S.items.find(x=>x.id==id)||{}).date=c.dataset.d;render()}});
setInterval(()=>{if(!run)return;const k=td()+'|'+run;S.sec[k]=(S.sec[k]||0)+1;const el=document.querySelector(`.tm[data-k="${run}"]`);if(el)el.textContent=fmt(S.sec[k]);if(S.sec[k]%15==0)save()},1000);
let qi=0;const q=$('#q');q.textContent=QUOTES[0];setInterval(()=>{q.style.opacity=0;setTimeout(()=>{q.textContent=QUOTES[++qi%QUOTES.length];q.style.opacity=1},800)},12000);
document.documentElement.dataset.theme=S.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
addEventListener('beforeunload',save);render();
</script></body></html>
